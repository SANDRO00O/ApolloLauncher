plugins { id 'com.android.application' }
android {
    namespace 'com.karrar.tvlauncher'
    compileSdk 33
    defaultConfig {
        applicationId 'com.karrar.tvlauncher'
        minSdk 21
        targetSdk 22
        versionCode 2
        versionName '2.0'
    }
    buildTypes { release { minifyEnabled false } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
