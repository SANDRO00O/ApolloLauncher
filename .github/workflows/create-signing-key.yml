name: ApolloLauncher Create Signing Key

on:
  workflow_dispatch:
    inputs:
      age_recipient:
        description: "Your SSH Ed25519 public key (ssh-ed25519 AAAA...); never enter the private key"
        required: true
        type: string
      confirm_new_key:
        description: "I understand this creates a new permanent Android signing key"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: apollolauncher-signing-key
  cancel-in-progress: false

jobs:
  create-key:
    name: Generate and encrypt Android signing key
    runs-on: ubuntu-latest

    steps:
      - name: Check inputs and existing release key
        shell: bash
        env:
          AGE_RECIPIENT: ${{ inputs.age_recipient }}
          CONFIRM_NEW_KEY: ${{ inputs.confirm_new_key }}
          HAS_EXISTING_RELEASE_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          set -euo pipefail

          if [[ "$CONFIRM_NEW_KEY" != "true" ]]; then
            echo "::error::Confirm that you understand this creates a new permanent signing key."
            exit 1
          fi

          if [[ "$HAS_EXISTING_RELEASE_KEY" == "true" ]]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 already exists. Refusing to generate a replacement signing key."
            exit 1
          fi

          if [[ ! "$AGE_RECIPIENT" =~ ^ssh-ed25519[[:space:]]+[A-Za-z0-9+/]+={0,3}([[:space:]].*)?$ ]]; then
            echo "::error::Recipient must be one OpenSSH ssh-ed25519 public-key line. Do not enter a private key."
            exit 1
          fi

          echo "Inputs validated. The signing key will be encrypted to your public key."

      - name: Install age
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes age

      - name: Generate, encrypt, and package signing key
        id: package
        shell: bash
        env:
          AGE_RECIPIENT: ${{ inputs.age_recipient }}
        run: |
          set -euo pipefail
          umask 077

          WORK_DIR="$RUNNER_TEMP/apollo-signing-key"
          mkdir -p "$WORK_DIR"
          trap 'rm -rf "$WORK_DIR"' EXIT

          KEYSTORE_FILE="$WORK_DIR/apollo-release.jks"
          CREDENTIALS_FILE="$WORK_DIR/GITHUB-SECRETS.txt"
          RECIPIENT_FILE="$WORK_DIR/recipient.pub"
          BUNDLE_FILE="$RUNNER_TEMP/ApolloLauncher-signing-key.tar.gz"
          ENCRYPTED_FILE="$RUNNER_TEMP/ApolloLauncher-signing-key.tar.gz.age"

          STORE_PASSWORD="$(openssl rand -hex 32)"
          KEY_PASSWORD="$(openssl rand -hex 32)"
          KEY_ALIAS="apollo-release"

          printf '%s\n' "$AGE_RECIPIENT" > "$RECIPIENT_FILE"

          keytool -genkeypair -v \
            -keystore "$KEYSTORE_FILE" \
            -storetype JKS \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 3072 \
            -validity 10000 \
            -dname "CN=ApolloLauncher Release, OU=Android, O=ApolloLauncher, C=IQ"

          keytool -list \
            -keystore "$KEYSTORE_FILE" \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null

          KEYSTORE_BASE64="$(base64 "$KEYSTORE_FILE" | tr -d '\r\n')"

          {
            printf 'ANDROID_KEYSTORE_BASE64=%s\n' "$KEYSTORE_BASE64"
            printf 'ANDROID_KEYSTORE_PASSWORD=%s\n' "$STORE_PASSWORD"
            printf 'ANDROID_KEY_ALIAS=%s\n' "$KEY_ALIAS"
            printf 'ANDROID_KEY_PASSWORD=%s\n' "$KEY_PASSWORD"
          } > "$CREDENTIALS_FILE"

          echo "::add-mask::$KEYSTORE_BASE64"
          echo "::add-mask::$STORE_PASSWORD"
          echo "::add-mask::$KEY_PASSWORD"

          tar -czf "$BUNDLE_FILE" \
            -C "$WORK_DIR" \
            apollo-release.jks \
            GITHUB-SECRETS.txt

          age --encrypt --recipients-file "$RECIPIENT_FILE" \
            --output "$ENCRYPTED_FILE" "$BUNDLE_FILE"

          test -s "$ENCRYPTED_FILE"
          sha256sum "$ENCRYPTED_FILE" > "$ENCRYPTED_FILE.sha256"

          rm -f "$BUNDLE_FILE" "$KEYSTORE_FILE" "$CREDENTIALS_FILE" "$RECIPIENT_FILE"

          echo "encrypted_file=$ENCRYPTED_FILE" >> "$GITHUB_OUTPUT"
          echo "checksum_file=$ENCRYPTED_FILE.sha256" >> "$GITHUB_OUTPUT"
          echo "Keystore generated, verified, and encrypted. Plaintext files were removed from the runner workspace."

      - name: Upload encrypted signing-key bundle
        uses: actions/upload-artifact@v4
        with:
          name: ApolloLauncher-signing-key-encrypted
          path: |
            ${{ steps.package.outputs.encrypted_file }}
            ${{ steps.package.outputs.checksum_file }}
          if-no-files-found: error
          retention-days: 1

      - name: Write next steps to run summary
        shell: bash
        run: |
          {
            echo "## ApolloLauncher signing key created"
            echo
            echo "The artifact contains only an age-encrypted archive. Download it and decrypt it with the SSH private key matching the public key supplied to this workflow."
            echo
            echo "1. Download `ApolloLauncher-signing-key-encrypted` from this run's Artifacts section."
            echo "2. Decrypt the `.age` file on your own device."
            echo "3. Open `GITHUB-SECRETS.txt` and add each value as a separate repository Actions secret."
            echo "4. Keep a secure offline backup of `apollo-release.jks`."
            echo
            echo "The encrypted artifact expires after one day. The private SSH key was never uploaded."
          } >> "$GITHUB_STEP_SUMMARY"
