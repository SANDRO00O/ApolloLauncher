name: Temporary Logo Export

on: push

permissions:
  contents: read

jobs:
  export-logo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: ApolloLauncher-logo-original
          path: assets/apollolauncher-logo.svg
          if-no-files-found: error
          retention-days: 1
